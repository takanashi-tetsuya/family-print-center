# Only the Python application reaches this scheduler. No LAN CUPS admin port.
Listen 127.0.0.1:631
Listen /run/cups/cups.sock
WebInterface No
Browsing No
DefaultShared No
DefaultAuthType Basic
DefaultEncryption Never
DefaultPolicy default
DefaultPaperSize A4
LogLevel warn
MaxLogSize 0
MaxJobs 200
MaxJobsPerPrinter 100
PreserveJobHistory Yes
PreserveJobFiles No

<Location />
  Order deny,allow
  Deny all
  Allow localhost
</Location>

<Location /admin>
  Order deny,allow
  Deny all
  Allow localhost
  AuthType Basic
  Require user familyprint
  Satisfy all
</Location>

<Location /admin/conf>
  Order allow,deny
  Deny all
</Location>

<Policy default>
  JobPrivateAccess default
  # Jobs are shared by the password-free family UI. This scheduler is local-only.
  JobPrivateValues none
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  # LibreOffice's native CUPS client runs as familyprint and has no Python
  # password callback. Submission and capability queries trust loopback only.
  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document Send-URI Close-Job Get-Printer-Attributes Get-Job-Attributes Get-Jobs CUPS-Get-Printers CUPS-Get-Classes CUPS-Get-Default CUPS-Get-PPDs>
    Order deny,allow
    Deny all
    Allow localhost
    AuthType None
  </Limit>

  <Limit Hold-Job Release-Job Restart-Job Cancel-Job Cancel-My-Jobs Set-Job-Attributes CUPS-Authenticate-Job CUPS-Move-Job CUPS-Get-Document>
    Order deny,allow
    Deny all
    Allow localhost
    AuthType Basic
    Require user @OWNER
    Satisfy all
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer CUPS-Accept-Jobs CUPS-Reject-Jobs Cancel-Jobs>
    Order deny,allow
    Deny all
    Allow localhost
    AuthType Basic
    Require user familyprint
    Satisfy all
  </Limit>

  <Limit All>
    Order deny,allow
    Deny all
    Allow localhost
    AuthType Basic
    Require user familyprint
    Satisfy all
  </Limit>
</Policy>
